<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分享我的位置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one column; consent card first, then live map and readouts once the visitor agrees */
:root{
  --bg:#f1f4f8; --surface:#fff; --fg:#152033; --muted:#5d6b80; --line:#d6dde8;
  --accent:#2563c9; --accent-fg:#fff; --live:#12925f; --bad:#c2402f;
  --text:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141d; --surface:#161f2b; --fg:#e3e9f2; --muted:#93a1b5; --line:#263244;
  --accent:#5b93ee; --accent-fg:#0e141d; --live:#3ccf8e; --bad:#f07a69; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--text);
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.card p{margin:0 0 8px}
.card ul{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
button{appearance:none;border:0;border-radius:12px;font:600 16px var(--text);padding:13px 16px;cursor:pointer;width:100%}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg)}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.live .dot{background:var(--live);box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 25%,transparent)}
.err{color:var(--bad)}
#map{height:280px;border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.msg{font-family:var(--num);font-size:13px;background:var(--bg);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.note{font-size:12px;color:var(--muted);margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">分享我的位置</h1>

  <div class="card" id="consent">
    <p id="ask">有人请你分享当前位置。是否分享由你决定。</p>
    <ul>
      <li>点下面的按钮后，手机会询问是否允许定位，点「允许」才会开始。</li>
      <li>位置先显示在你自己的手机上，不会自动发出去。由你复制后发给对方。</li>
      <li>随时可以点「停止定位」，关掉这个页面也会停止。</li>
    </ul>
  </div>
  <button class="primary" id="start" type="button">同意并开始定位</button>

  <div id="live" hidden>
    <div class="wrap">
      <div class="status" id="status"><span class="dot"></span><span id="statusText">正在获取位置…</span></div>
      <div id="map"></div>
      <div class="card">
        <dl>
          <dt>纬度</dt><dd id="lat">—</dd>
          <dt>经度</dt><dd id="lng">—</dd>
          <dt>精度</dt><dd id="acc">—</dd>
          <dt>速度</dt><dd id="spd">—</dd>
          <dt>更新时间</dt><dd id="time">—</dd>
        </dl>
      </div>
      <div class="card">
        <p style="font-size:14px;color:var(--muted)">发给对方的内容：</p>
        <div class="msg" id="msg">—</div>
      </div>
      <div class="row">
        <button class="primary" id="copy" type="button">复制位置</button>
        <button class="ghost" id="share" type="button">发送…</button>
      </div>
      <button class="ghost" id="stop" type="button">停止定位</button>
      <p class="note">位置变化时会自动更新。想让对方看到最新位置，需要重新复制发送一次。锁屏或切到其他应用时，定位通常会暂停。</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const to = new URLSearchParams(location.search).get('to');
  if (to) {
    const name = to.slice(0, 20);
    $('ask').textContent = name + ' 请你分享当前位置。是否分享由你决定。';
    $('title').textContent = '把位置分享给 ' + name;
  }

  // WGS-84 (GPS) -> GCJ-02 (used by Chinese maps such as Amap)
  function outOfChina(lat,lng){ return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271; }
  function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3; r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3; return r;}
  function tLng(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3; r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3; return r;}
  function toGcj(lat,lng){
    if(outOfChina(lat,lng)) return [lat,lng];
    const a=6378245.0, ee=0.00669342162296594323;
    let dLat=tLat(lng-105,lat-35), dLng=tLng(lng-105,lat-35);
    const rad=lat/180*Math.PI; let m=Math.sin(rad); m=1-ee*m*m; const s=Math.sqrt(m);
    dLat=(dLat*180)/((a*(1-ee))/(m*s)*Math.PI); dLng=(dLng*180)/(a/s*Math.cos(rad)*Math.PI);
    return [lat+dLat,lng+dLng];
  }

  let map, marker, circle, path, watchId = null, last = null;
  function initMap(){
    if (map || !window.L) return;
    map = L.map('map',{zoomControl:true,attributionControl:true}).setView([35,105],4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    path = L.polyline([], {color:'#2563c9', weight:4}).addTo(map);
  }

  function setStatus(text, cls){
    $('status').className = 'status' + (cls ? ' ' + cls : '');
    $('statusText').textContent = text;
  }

  function message(p){
    const lat=p.coords.latitude, lng=p.coords.longitude;
    const [glat,glng]=toGcj(lat,lng);
    const t=new Date(p.timestamp).toLocaleString('zh-CN',{hour12:false});
    return '我的位置（' + t + '，精度约 ' + Math.round(p.coords.accuracy) + ' 米）\n'
      + '高德地图：https://uri.amap.com/marker?position=' + glng.toFixed(6) + ',' + glat.toFixed(6) + '&name=' + encodeURIComponent('我的位置') + '&coordinate=gaode\n'
      + '谷歌地图：https://maps.google.com/?q=' + lat.toFixed(6) + ',' + lng.toFixed(6);
  }

  function onPos(p){
    last = p;
    const c = p.coords, ll = [c.latitude, c.longitude];
    $('lat').textContent = c.latitude.toFixed(6);
    $('lng').textContent = c.longitude.toFixed(6);
    $('acc').textContent = '约 ' + Math.round(c.accuracy) + ' 米';
    $('spd').textContent = c.speed != null && !isNaN(c.speed) ? (c.speed*3.6).toFixed(1) + ' 公里/小时' : '—';
    $('time').textContent = new Date(p.timestamp).toLocaleTimeString('zh-CN',{hour12:false});
    $('msg').textContent = message(p);
    setStatus('正在实时定位', 'live');
    if (map) {
      if (!marker) { marker = L.marker(ll).addTo(map); circle = L.circle(ll,{radius:c.accuracy,weight:1}).addTo(map); map.setView(ll,16); }
      else { marker.setLatLng(ll); circle.setLatLng(ll).setRadius(c.accuracy); map.panTo(ll); }
      path.addLatLng(ll);
    }
  }

  function onErr(e){
    const why = {1:'你没有允许定位。可以在浏览器或系统设置里给这个网站打开定位权限后再试。',
                 2:'暂时获取不到位置，请到信号更好的地方或打开 GPS 后再试。',
                 3:'定位超时，请稍后再试。'}[e.code] || '定位失败：' + e.message;
    setStatus(why, 'err');
    if (e.code === 1) stop();
  }

  function start(){
    if (!('geolocation' in navigator)) { $('live').hidden=false; setStatus('这个浏览器不支持定位。', 'err'); return; }
    if (!window.isSecureContext) { $('live').hidden=false; setStatus('定位需要通过 https 打开这个页面。', 'err'); return; }
    $('consent').hidden = true; $('start').hidden = true; $('live').hidden = false;
    initMap(); setTimeout(()=>map && map.invalidateSize(), 50);
    setStatus('正在获取位置…');
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }

  function stop(){
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    $('start').hidden = false; $('start').textContent = '重新开始定位';
    if (!$('status').classList.contains('err')) setStatus('已停止定位');
  }

  async function copy(){
    if (!last) return;
    const text = message(last);
    try { await navigator.clipboard.writeText(text); $('copy').textContent = '已复制'; }
    catch(e){ const r=document.createRange(); r.selectNodeContents($('msg')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('copy').textContent='已选中，请手动复制'; }
    setTimeout(()=>$('copy').textContent='复制位置', 2000);
  }

  async function share(){
    if (!last) return;
    if (navigator.share) { try { await navigator.share({text: message(last)}); } catch(e){} }
    else copy();
  }

  $('start').addEventListener('click', start);
  $('stop').addEventListener('click', stop);
  $('copy').addEventListener('click', copy);
  $('share').addEventListener('click', share);
})();
</script>
</body>
</html>
